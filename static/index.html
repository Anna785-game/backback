<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPS Tracker Live</title>

<style>

body {
    font-family: Arial;
    padding: 20px;
    background: #f5f5f5;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

button {
    padding: 10px 15px;
    margin: 5px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.start { background: #2196F3; color: white; }
.stop { background: #f44336; color: white; }

#logs {
    background: black;
    color: #00ff00;
    padding: 10px;
    height: 300px;
    overflow-y: auto;
    font-family: monospace;
}

.status {
    font-weight: bold;
}

</style>
</head>

<body>

<h1>GPS Tracker LIVE</h1>

<div class="card">

<button class="start" onclick="startTracking()">
    START
</button>

<button class="stop" onclick="stopTracking()">
    STOP
</button>

<div class="status" id="status">Idle</div>
<div id="timer">00:00</div>

</div>

<div class="card">
<h2>Logs</h2>
<div id="logs"></div>
</div>

<script>

let sessionId = null;
let watchId = null;
let timerInterval = null;
let startTime = null;
let isRunning = false;

// ---------------- LOGS ----------------

function log(msg) {
    const logs = document.getElementById("logs");
    logs.innerHTML += `<div>${new Date().toLocaleTimeString()} : ${msg}</div>`;
    logs.scrollTop = logs.scrollHeight;
}

function setStatus(s) {
    document.getElementById("status").innerText = s;
}

// ---------------- TIMER ----------------

function startTimer() {

    startTime = Date.now();

    timerInterval = setInterval(() => {

        let diff = Date.now() - startTime;

        let sec = Math.floor(diff / 1000);
        let min = Math.floor(sec / 60);

        sec = sec % 60;

        document.getElementById("timer").innerText =
            `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;

    }, 1000);
}

function stopTimer() {
    clearInterval(timerInterval);
}

// ---------------- START ----------------

async function startTracking() {

    if (isRunning) return;

    setStatus("Starting GPS...");
    log("START pressed");

    const res = await fetch(
        "https://backback-3-5xe2.onrender.com/routes/create",
        {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                user_id: "anna",
                route_name: "LIVE TRACK",
                points: []
            })
        }
    );

    const data = await res.json();
    sessionId = data.route_id;

    log("Session created: " + sessionId);

    await fetch(
        `https://backback-3-5xe2.onrender.com/tracking/start/${sessionId}`,
        {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                user_id: "anna",
                latitude: 0,
                longitude: 0
            })
        }
    );

    isRunning = true;
    setStatus("Tracking LIVE");

    startTimer();

    watchId = navigator.geolocation.watchPosition(
        sendPosition,
        err => log("GPS error: " + err.message),
        {
            enableHighAccuracy: true,
            maximumAge: 1000
        }
    );
}

// ---------------- SEND POSITION ----------------

async function sendPosition(pos) {

    if (!isRunning) return;

    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    const res = await fetch(
        `https://backback-3-5xe2.onrender.com/tracking/update/${sessionId}`,
        {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                user_id: "anna",
                latitude: lat,
                longitude: lon
            })
        }
    );

    const data = await res.json();

    log(`GPS ${lat.toFixed(6)}, ${lon.toFixed(6)}`);
    log(`Distance route: ${data.distance_from_route} m`);

    if (data.alert) {
        log("🚨 " + data.alert);
        setStatus("ALERT");
    }
}

// ---------------- STOP ----------------

function stopTracking() {

    isRunning = false;

    if (watchId) {
        navigator.geolocation.clearWatch(watchId);
    }

    stopTimer();

    setStatus("Stopped");
    log("STOP pressed");
}

</script>

</body>
</html>
