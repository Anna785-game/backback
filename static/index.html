<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Tracker Real</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            margin-bottom: 10px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        input {
            width: 220px;
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        .create-btn {
            background: #4CAF50;
            color: white;
        }

        .start-btn {
            background: #2196F3;
            color: white;
        }

        .stop-btn {
            background: #f44336;
            color: white;
        }

        .status {
            font-weight: bold;
            margin-top: 10px;
        }

        #logs {
            background: black;
            color: #00ff00;
            padding: 10px;
            height: 350px;
            overflow-y: auto;
            border-radius: 10px;
            font-family: monospace;
        }

    </style>

</head>

<body>

<h1>GPS Tracker REAL</h1>

<div class="card">

    <h2>Route (optionnel pour test déviation)</h2>

    <input id="startLat" type="number" step="any" placeholder="Lat A" value="-18.8792">
    <input id="startLon" type="number" step="any" placeholder="Lon A" value="47.5079">

    <input id="endLat" type="number" step="any" placeholder="Lat B" value="-18.8850">
    <input id="endLon" type="number" step="any" placeholder="Lon B" value="47.5150">

    <br><br>

    <button class="create-btn" onclick="createRoute()">
        Créer Route
    </button>

    <button class="start-btn" onclick="startGPS()">
        START GPS RÉEL
    </button>

    <button class="stop-btn" onclick="stopGPS()">
        STOP
    </button>

    <div class="status" id="status">
        Statut : idle
    </div>

</div>

<div class="card">

    <h2>Logs</h2>
    <div id="logs"></div>

</div>

<script>

let routeId = null;
let sessionId = null;
let watchId = null;
let isTracking = false;

// ---------------- LOGS ----------------

function log(msg) {
    const logs = document.getElementById("logs");
    logs.innerHTML += `<div>${new Date().toLocaleTimeString()} : ${msg}</div>`;
    logs.scrollTop = logs.scrollHeight;
}

function setStatus(s) {
    document.getElementById("status").innerText = "Statut : " + s;
}

// ---------------- ROUTE ----------------

function generateRoute(startLat, startLon, endLat, endLon, steps = 30) {

    let points = [];

    for (let i = 0; i <= steps; i++) {

        const t = i / steps;

        points.push({
            latitude: startLat + (endLat - startLat) * t,
            longitude: startLon + (endLon - startLon) * t
        });
    }

    return points;
}

async function createRoute() {

    const startLat = parseFloat(document.getElementById("startLat").value);
    const startLon = parseFloat(document.getElementById("startLon").value);
    const endLat = parseFloat(document.getElementById("endLat").value);
    const endLon = parseFloat(document.getElementById("endLon").value);

    const route = generateRoute(startLat, startLon, endLat, endLon);

    const res = await fetch("/routes/create", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            user_id: "anna",
            route_name: "test route",
            points: route
        })
    });

    const data = await res.json();

    routeId = data.route_id;

    log("Route créée");
    setStatus("route OK");
}

// ---------------- GPS RÉEL ----------------

async function startGPS() {

    if (!routeId) {
        log("Crée une route d'abord");
        return;
    }

    const res = await fetch(`/tracking/start/${routeId}`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            user_id: "anna",
            latitude: 0,
            longitude: 0
        })
    });

    const data = await res.json();

    sessionId = data.session_id;
    isTracking = true;

    log("GPS START");
    setStatus("tracking live");

    watchId = navigator.geolocation.watchPosition(
        sendGPS,
        err => log("GPS error: " + err.message),
        {
            enableHighAccuracy: true,
            maximumAge: 1000,
            timeout: 5000
        }
    );
}

async function sendGPS(position) {

    if (!isTracking) return;

    const lat = position.coords.latitude;
    const lon = position.coords.longitude;

    const res = await fetch(`/tracking/update/${sessionId}`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            user_id: "anna",
            latitude: lat,
            longitude: lon
        })
    });

    const data = await res.json();

    log(`GPS: ${lat.toFixed(6)}, ${lon.toFixed(6)}`);
    log(`Distance: ${data.distance_from_route} m`);

    if (data.alert) {
        log("🚨 " + data.alert);
        setStatus("ALERTE");
    }
}

function stopGPS() {

    isTracking = false;

    if (watchId) {
        navigator.geolocation.clearWatch(watchId);
    }

    setStatus("stopped");
    log("GPS STOP");
}

</script>

</body>
</html>
